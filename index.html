<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🍹 Home Bar Recipe Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">

<style>
/* ─── RESET ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }

:root {
  --bg-deep:    #0c0b09;
  --bg-base:    #131109;
  --bg-card:    #1a1713;
  --bg-hover:   #201d18;
  --glass:      rgba(255,255,255,0.04);
  --border:     rgba(255,255,255,0.08);
  --border-hi:  rgba(210,165,70,0.35);

  --amber:      #c89840;
  --amber-l:    #e8b84b;
  --amber-dim:  rgba(200,152,64,0.14);
  --green:      #4a7c59;  --green-l:#5f9e72;  --green-dim:rgba(74,124,89,0.16);
  --rose:       #b05a6a;  --rose-l:#d4849a;   --rose-dim:rgba(176,90,106,0.16);
  --indigo:     #5b6eae;  --indigo-l:#8ea0d8; --indigo-dim:rgba(91,110,174,0.16);
  --teal:       #3a8a8a;  --teal-l:#6abcbc;   --teal-dim:rgba(58,138,138,0.16);
  --burnt:      #a0642a;  --burnt-l:#d4a06a;  --burnt-dim:rgba(160,100,42,0.16);
  --sky:        #3a7aaa;  --sky-l:#80b8e0;    --sky-dim:rgba(58,122,170,0.16);

  --txt-h:  #f5ecd7;
  --txt-p:  #c8b99a;
  --txt-s:  #7d6e58;
  --txt-xs: #524438;

  --ff-disp: 'Playfair Display', Georgia, serif;
  --ff-body: 'DM Sans', system-ui, sans-serif;

  --r-sm: 6px; --r-md: 10px; --r-lg: 16px; --r-xl: 22px; --r-full: 999px;
  --shadow: 0 4px 24px rgba(0,0,0,0.5);
}

body {
  background: var(--bg-deep);
  color: var(--txt-p);
  font-family: var(--ff-body);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

/* grain */
body::after {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
}

/* ─── WRAPPER ───────────────────────────────────────── */
.rb {
  position:relative; z-index:1;
  max-width:1120px; margin:0 auto;
  padding: 2rem 1rem 5rem;
}

/* ─── HEADER ────────────────────────────────────────── */
.hdr { text-align:center; margin-bottom:1.75rem; animation:slideDown .6s ease both; }
.hdr-eye { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--amber); opacity:.7; margin-bottom:.35rem; }
.hdr-title {
  font-family:var(--ff-disp); font-weight:700;
  font-size:clamp(28px,6vw,50px); line-height:1.1;
  background:linear-gradient(135deg,#f5ecd7 20%,var(--amber-l));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  margin-bottom:.3rem;
}
.hdr-sub { font-size:12px; color:var(--txt-s); }

/* divider */
.dvdr { display:flex; align-items:center; gap:10px; margin:1.25rem 0 1.75rem; opacity:.35; }
.dvdr::before,.dvdr::after { content:''; flex:1; height:1px; background:linear-gradient(to right,transparent,var(--amber)); }
.dvdr::after { background:linear-gradient(to left,transparent,var(--amber)); }

/* ─── TABS ──────────────────────────────────────────── */
.tabs { display:flex; gap:4px; background:var(--glass); border:1px solid var(--border); border-radius:var(--r-xl); padding:4px; margin-bottom:1.5rem; animation:slideDown .6s .05s ease both; }
.tab {
  flex:1; text-align:center; padding:8px 4px; border-radius:var(--r-lg);
  font-size:12px; font-family:var(--ff-body); font-weight:500;
  border:none; background:transparent; color:var(--txt-s); cursor:pointer;
  transition:all .2s; white-space:nowrap;
}
.tab.active { background:var(--bg-hover); color:var(--txt-h); box-shadow:0 2px 8px rgba(0,0,0,.4); }
.tab-emoji { display:block; font-size:18px; margin-bottom:2px; }

/* panels */
.panel { display:none; animation:fadeIn .25s ease; }
.panel.active { display:block; }

/* ─── STATS ─────────────────────────────────────────── */
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:1.5rem; animation:slideDown .6s .1s ease both; }
.stat { background:var(--glass); border:1px solid var(--border); border-radius:var(--r-lg); padding:.75rem .5rem; text-align:center; transition:border-color .25s,transform .25s; }
.stat:hover { border-color:var(--border-hi); transform:translateY(-2px); }
.stat-n { font-family:var(--ff-disp); font-size:24px; font-weight:700; color:var(--amber-l); line-height:1; }
.stat-l { font-size:9px; color:var(--txt-s); letter-spacing:1px; text-transform:uppercase; margin-top:3px; }

/* ─── SEARCH ────────────────────────────────────────── */
.srch-wrap { position:relative; margin-bottom:1.25rem; }
.srch-ico { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--txt-s); font-size:16px; pointer-events:none; }
.srch {
  width:100%; padding:11px 40px 11px 40px;
  font-family:var(--ff-body); font-size:14px;
  background:var(--glass); border:1px solid var(--border); border-radius:var(--r-xl);
  color:var(--txt-h); outline:none; transition:border-color .2s,box-shadow .2s;
}
.srch::placeholder { color:var(--txt-s); }
.srch:focus { border-color:var(--border-hi); box-shadow:0 0 0 3px rgba(200,152,64,.07); }
.srch-clear { position:absolute; right:13px; top:50%; transform:translateY(-50%); color:var(--txt-s); background:none; border:none; cursor:pointer; font-size:18px; padding:2px; display:none; }
.srch-clear.show { display:block; }

/* ─── FILTERS ───────────────────────────────────────── */
.rlabel { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--txt-s); margin:1rem 0 5px; display:flex; align-items:center; gap:8px; }
.rlabel::after { content:''; flex:1; height:1px; background:var(--border); }
.frow { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:.15rem; }
.fbtn {
  font-size:11px; font-family:var(--ff-body); padding:5px 12px;
  border-radius:var(--r-full); border:1px solid var(--border);
  background:transparent; color:var(--txt-s); cursor:pointer; transition:all .18s;
  white-space:nowrap; touch-action:manipulation;
}
.fbtn:hover { background:var(--glass); color:var(--txt-p); }
#baseF .fbtn.active[data-val="all"],#typeF .fbtn.active,#seasonF .fbtn.active { background:var(--amber-dim); color:var(--amber-l); border-color:var(--amber); }
#baseF .fbtn.active[data-val="gin"]    { background:var(--green-dim);  color:var(--green-l);  border-color:var(--green);  }
#baseF .fbtn.active[data-val="vodka"]  { background:var(--indigo-dim); color:var(--indigo-l); border-color:var(--indigo); }
#baseF .fbtn.active[data-val="whisky"] { background:var(--amber-dim);  color:var(--amber-l);  border-color:var(--amber);  }
#baseF .fbtn.active[data-val="rum"]    { background:var(--rose-dim);   color:var(--rose-l);   border-color:var(--rose);   }
#baseF .fbtn.active[data-val="tequila"]{ background:var(--sky-dim);    color:var(--sky-l);    border-color:var(--sky);    }
#baseF .fbtn.active[data-val="brandy"] { background:var(--burnt-dim);  color:var(--burnt-l);  border-color:var(--burnt);  }
#baseF .fbtn.active[data-val="wine"]   { background:var(--rose-dim);   color:#c47080;         border-color:var(--rose);   }
#baseF .fbtn.active[data-val="beer"]   { background:var(--amber-dim);  color:var(--amber-l);  border-color:var(--amber);  }
#baseF .fbtn.active[data-val="peach schnapps"] { background:rgba(220,140,80,.16); color:#f0a870; border-color:#d4885a; }
#baseF .fbtn.active[data-val="virgin"] { background:var(--teal-dim);   color:var(--teal-l);   border-color:var(--teal);   }

/* ─── INGREDIENT FILTER ─────────────────────────────── */
.ing-filter-wrap { margin-top:.75rem; padding:1rem; background:var(--glass); border:1px solid var(--border); border-radius:var(--r-lg); }
.ing-intro { font-size:12px; color:var(--txt-s); margin-bottom:.75rem; }
.ing-grid { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:.75rem; }
.ing-chk { display:none; }
.ing-lbl {
  font-size:11px; padding:4px 11px; border-radius:var(--r-full);
  border:1px solid var(--border); background:transparent;
  color:var(--txt-s); cursor:pointer; transition:all .18s; touch-action:manipulation;
}
.ing-chk:checked + .ing-lbl { background:var(--green-dim); color:var(--green-l); border-color:var(--green); }
.ing-match-info { font-size:11px; color:var(--txt-s); font-style:italic; }
.ing-reset { font-size:11px; padding:4px 12px; border-radius:var(--r-full); border:1px solid var(--border); background:transparent; color:var(--txt-s); cursor:pointer; margin-left:8px; transition:all .18s; }
.ing-reset:hover { border-color:var(--rose); color:var(--rose-l); }

/* ─── COUNT ─────────────────────────────────────────── */
.count { font-size:11px; color:var(--txt-s); margin:.9rem 0 .6rem; letter-spacing:.5px; }

/* ─── GRID ──────────────────────────────────────────── */
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:10px; }

/* ─── CARD ──────────────────────────────────────────── */
.card {
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:.85rem 1rem; cursor:pointer;
  transition:border-color .2s,transform .2s,box-shadow .2s;
  box-shadow:var(--shadow); animation:cardIn .35s ease both; position:relative; overflow:hidden;
}
.card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg,transparent,var(--card-accent,var(--amber)),transparent);
  opacity:0; transition:opacity .3s;
}
.card:hover { border-color:rgba(255,255,255,.13); transform:translateY(-2px); box-shadow:var(--shadow),0 0 20px rgba(200,152,64,.1); }
.card:hover::before, .card.open::before { opacity:1; }
.card.open { border-color:var(--border-hi); background:var(--bg-hover); }

/* accent per spirit */
.card[data-base~="gin"]    { --card-accent: var(--green-l); }
.card[data-base~="vodka"]  { --card-accent: var(--indigo-l); }
.card[data-base~="whisky"] { --card-accent: var(--amber-l); }
.card[data-base~="rum"]    { --card-accent: var(--rose-l); }
.card[data-base~="tequila"]{ --card-accent: var(--sky-l); }
.card[data-base~="brandy"] { --card-accent: var(--burnt-l); }
.card[data-base~="wine"]   { --card-accent: #c47080; }
.card[data-base~="beer"]   { --card-accent: var(--amber-l); }
.card[data-base~="peach schnapps"] { --card-accent: #f0a870; }
.card[data-base~="virgin"] { --card-accent: var(--teal-l); }

.card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
.card-left { flex:1; min-width:0; }
.card-emoji { font-size:20px; margin-bottom:3px; }
.card-name { font-family:var(--ff-disp); font-size:14px; font-weight:700; color:var(--txt-h); margin-bottom:1px; line-height:1.2; }
.card-meta { font-size:11px; color:var(--txt-s); margin-bottom:7px; }
.chill-flag { display:inline-block; font-size:9px; background:rgba(58,122,170,.18); color:var(--sky-l); border:1px solid rgba(58,122,170,.3); border-radius:var(--r-full); padding:1px 7px; margin-left:5px; vertical-align:middle; letter-spacing:.5px; }

.tags { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:3px; align-items:center; }
.tag { font-size:9px; font-weight:500; letter-spacing:.4px; padding:2px 7px; border-radius:var(--r-full); line-height:1.5; text-transform:uppercase; }
.t-sig { background:rgba(200,152,64,.16); color:var(--amber-l); border:1px solid rgba(200,152,64,.28); }
.t-ind { background:var(--green-dim);   color:var(--green-l);  border:1px solid rgba(74,124,89,.3); }
.t-sum { background:rgba(220,170,40,.13); color:#e8c054;         border:1px solid rgba(220,170,40,.24); }
.t-mon { background:rgba(60,110,190,.15); color:#7ea0d8;         border:1px solid rgba(60,110,190,.28); }
.t-win { background:rgba(90,70,180,.15);  color:#a898e0;         border:1px solid rgba(90,70,180,.28); }
.t-cls { background:var(--glass);        color:var(--txt-s);    border:1px solid var(--border); }
.t-fut { background:var(--rose-dim);     color:var(--rose-l);   border:1px solid rgba(176,90,106,.3); }
.t-vir { background:var(--teal-dim);     color:var(--teal-l);   border:1px solid rgba(58,138,138,.3); }
.t-beer{ background:rgba(200,152,64,.13);color:#d4a04a;         border:1px solid rgba(200,152,64,.25); }

.dots { display:flex; gap:4px; align-items:center; margin-left:2px; }
.dot { width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.06); }
.dot.on { background:var(--amber); border-color:var(--amber-l); box-shadow:0 0 4px var(--amber); }

.chevron { font-size:14px; color:var(--txt-s); transition:transform .3s cubic-bezier(.34,1.56,.64,1),color .2s; flex-shrink:0; margin-top:2px; line-height:1; }
.card.open .chevron { transform:rotate(180deg); color:var(--amber); }

/* ─── DETAIL ────────────────────────────────────────── */
.detail { max-height:0; overflow:hidden; transition:max-height .4s cubic-bezier(.4,0,.2,1),opacity .3s; opacity:0; }
.card.open .detail { max-height:1200px; opacity:1; }
.d-inner { border-top:1px solid var(--border); margin-top:9px; padding-top:9px; }

/* batch toggle */
.batch-row { display:flex; align-items:center; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
.batch-lbl { font-size:9px; color:var(--txt-s); text-transform:uppercase; letter-spacing:1.5px; }
.batch-btn { font-size:10px; padding:3px 10px; border-radius:var(--r-full); border:1px solid var(--border); background:transparent; color:var(--txt-s); cursor:pointer; transition:all .15s; touch-action:manipulation; }
.batch-btn.active { background:var(--amber-dim); color:var(--amber-l); border-color:var(--amber); }

.dlabel { font-size:9px; font-weight:500; color:var(--amber); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:5px; margin-top:9px; display:flex; align-items:center; gap:5px; }
.dlabel:first-child { margin-top:0; }

.ratio-wrap { display:flex; flex-wrap:wrap; gap:5px; }
.ri { font-size:11px; background:rgba(255,255,255,.05); border:1px solid var(--border); border-radius:var(--r-sm); padding:3px 9px; color:var(--txt-p); transition:background .2s; }
.ri:hover { background:rgba(255,255,255,.09); }
.ri strong { font-weight:500; color:var(--txt-h); }

.dtext { font-size:12px; color:var(--txt-p); line-height:1.65; }

/* technique glossary tooltips */
.tech {
  display:inline; border-bottom:1px dashed rgba(200,152,64,.45);
  color:inherit; cursor:help; position:relative;
}
.tech-tip {
  display:none; position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%);
  background:#2a2520; border:1px solid var(--border-hi); border-radius:var(--r-md);
  padding:7px 10px; font-size:11px; color:var(--txt-p); line-height:1.5;
  width:200px; z-index:100; box-shadow:0 8px 24px rgba(0,0,0,.6); pointer-events:none;
  white-space:normal;
}
.tech-tip::after { content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%); border:5px solid transparent; border-top-color:#2a2520; }
.tech:hover .tech-tip, .tech.tip-open .tech-tip { display:block; }

.dnote { font-size:11px; color:var(--txt-s); font-style:italic; margin-top:8px; padding:8px 10px; border-left:2px solid rgba(200,152,64,.25); background:rgba(200,152,64,.04); border-radius:0 var(--r-sm) var(--r-sm) 0; line-height:1.55; }

/* ─── MOOD PICKER ───────────────────────────────────── */
.mood-wrap { animation:fadeIn .3s ease; }
.mood-step { display:none; }
.mood-step.active { display:block; animation:fadeIn .25s ease; }
.mood-q { font-family:var(--ff-disp); font-size:18px; color:var(--txt-h); margin-bottom:.35rem; }
.mood-sub { font-size:12px; color:var(--txt-s); margin-bottom:1.25rem; }
.mood-opts { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:1.5rem; }
.mood-btn {
  padding:.9rem .75rem; border-radius:var(--r-lg); border:1px solid var(--border);
  background:var(--glass); color:var(--txt-p); cursor:pointer; text-align:left;
  transition:all .2s; touch-action:manipulation; font-family:var(--ff-body);
}
.mood-btn:hover { border-color:var(--border-hi); background:var(--bg-hover); transform:translateY(-1px); }
.mood-btn.selected { border-color:var(--amber); background:var(--amber-dim); }
.mood-btn-emoji { font-size:24px; display:block; margin-bottom:5px; }
.mood-btn-label { font-size:13px; font-weight:500; color:var(--txt-h); display:block; margin-bottom:2px; }
.mood-btn-desc { font-size:11px; color:var(--txt-s); display:block; }
.mood-nav { display:flex; gap:8px; align-items:center; margin-top:.5rem; }
.mood-next { padding:9px 22px; border-radius:var(--r-full); background:var(--amber); color:#0e0d0b; font-weight:500; font-size:13px; font-family:var(--ff-body); border:none; cursor:pointer; transition:all .2s; }
.mood-next:hover { background:var(--amber-l); }
.mood-next:disabled { opacity:.3; cursor:not-allowed; }
.mood-back { padding:9px 16px; border-radius:var(--r-full); border:1px solid var(--border); background:transparent; color:var(--txt-s); font-size:13px; font-family:var(--ff-body); cursor:pointer; transition:all .2s; }
.mood-back:hover { border-color:var(--border-hi); color:var(--txt-p); }
.mood-prog { display:flex; gap:5px; align-items:center; }
.mood-dot { width:6px; height:6px; border-radius:50%; background:var(--border); transition:background .2s; }
.mood-dot.done { background:var(--amber); }
.mood-results { }
.mood-rec-title { font-family:var(--ff-disp); font-size:16px; color:var(--txt-h); margin-bottom:1rem; }
.mood-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:8px; }
.mood-card {
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:.85rem 1rem; cursor:pointer; transition:all .2s; animation:cardIn .35s ease both;
  position:relative; overflow:hidden;
}
.mood-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg,transparent,var(--card-accent,var(--amber)),transparent);
}
.mood-card:hover { border-color:var(--border-hi); transform:translateY(-2px); }
.mood-card-name { font-family:var(--ff-disp); font-size:14px; font-weight:700; color:var(--txt-h); margin-bottom:2px; }
.mood-card-meta { font-size:11px; color:var(--txt-s); margin-bottom:6px; }
.mood-card-why { font-size:11px; color:var(--txt-p); font-style:italic; padding:6px 8px; background:rgba(200,152,64,.06); border-left:2px solid var(--amber-dim); border-radius:0 var(--r-sm) var(--r-sm) 0; }
.mood-restart { margin-top:1.25rem; padding:8px 20px; border-radius:var(--r-full); border:1px solid var(--border); background:transparent; color:var(--txt-s); font-size:12px; font-family:var(--ff-body); cursor:pointer; transition:all .2s; }
.mood-restart:hover { border-color:var(--border-hi); color:var(--txt-p); }

.qd-hero {
  background:var(--bg-card); border:1px solid var(--border-hi); border-radius:var(--r-xl);
  padding:1.5rem; cursor:pointer; transition:all .2s; position:relative; overflow:hidden;
  text-align:center; margin-bottom:.5rem;
}
.qd-hero::before {
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg,transparent,var(--amber-l),transparent);
}
.qd-hero:hover { transform:translateY(-3px); box-shadow:0 8px 32px rgba(200,152,64,.15); }
.qd-hero-emoji { font-size:40px; margin-bottom:.5rem; }
.qd-hero-name { font-family:var(--ff-disp); font-size:22px; font-weight:700; color:var(--txt-h); margin-bottom:4px; }
.qd-hero-meta { font-size:12px; color:var(--txt-s); margin-bottom:.75rem; }
.qd-hero-why { font-size:12px; color:var(--txt-p); font-style:italic; padding:8px 12px; background:rgba(200,152,64,.06); border-left:2px solid var(--amber-dim); border-radius:0 var(--r-sm) var(--r-sm) 0; text-align:left; margin-bottom:.75rem; }
.qd-hero-tap { font-size:11px; color:var(--amber); letter-spacing:.5px; }

/* ═══════════════════════════════════════════════════════
   TECHNIQUE GLOSSARY
═══════════════════════════════════════════════════════ */
const TECH = {
  'fine strain':      'Pour through a fine mesh strainer to remove tiny ice shards and pulp. Gives a cleaner, silkier mouthfeel.',
  'double strain':    'Shake strainer + fine mesh strainer together. Removes all pulp, seeds and froth you don\'t want.',
  'express':          'Hold citrus peel skin-side down over the glass and give it a sharp squeeze/twist — sprays the aromatic oils onto the drink surface.',
  'muddle':           '3-4 gentle presses with a muddler or the back of a spoon. You want the oils, not shredded pulp. Never crush hard.',
  'stir':             'Stir with a long bar spoon, 20-30 rotations. Chills and dilutes without aerating — for spirit-forward drinks.',
  'shake hard':       'Cap the shaker tight, shake vigorously for 10-12 seconds. Creates chill, dilution, and texture all at once.',
  'build over ice':   'Add ingredients directly into the glass over ice, in order. No shaker needed.',
  'float':            'Pour gently over the back of a bar spoon so it sits on top of the drink without mixing.',
  'dry shake':        'Shake without ice first — creates foam from egg white or cream. Then shake again with ice.',
  'cold brew':        'Steep in cold water in the fridge for 6-8 hours. Slower, smoother extraction — less bitterness than hot brew.',
};

function wrapTech(text) {
  return text.replace(
    /\b(fine strain|double strain|express(?:ed)?(?: peel| lemon| orange)?|muddle|stir(?:ring)?|shake hard|build over ice|float|dry shake|cold brew)\b/gi,
    (m) => {
      const key = Object.keys(TECH).find(k => m.toLowerCase().startsWith(k));
      if (!key) return m;
      return `<span class="tech" ontouchstart="toggleTip(this)">${m}<span class="tech-tip">${TECH[key]}</span></span>`;
    }
  );
}

function toggleTip(el) {
  // mobile: toggle on tap
  const wasOpen = el.classList.contains('tip-open');
  document.querySelectorAll('.tech.tip-open').forEach(t => t.classList.remove('tip-open'));
  if (!wasOpen) el.classList.add('tip-open');
}
document.addEventListener('click', () => {
  document.querySelectorAll('.tech.tip-open').forEach(t => t.classList.remove('tip-open'));
});

 ing:["vodka","jaljeera","lime","soda"],ratio:[["Vodka","2"],["Jaljeera concentrate","1"],["Fresh lime","0.5"],["Soda","3"]],method:"Build over ice. Pour vodka, jaljeera, lime. Top soda. Stir once slowly.",garnish:"Lime wedge, kala namak rim",note:"Cumin-coriander-mint profile against vodka is unusual and genuinely works. Available bottled at any kirana."},
{name:"Nimbu Pani Vodka",base:["vodka"],type:["indian","signature"],season:["summer"],complexity:1,glass:"Highball",chill:false,
 ing:["vodka","lime","simple syrup","soda","salt"],
 ratio:[["Vodka","2"],["Fresh lime","1"],["Simple syrup","0.75"],["Soda","3"],["Salt","pinch"]],
 method:"Squeeze lime into glass. Add syrup and a small pinch of salt. Build over ice — vodka first, top soda gently.",garnish:"Lime wheel, salt rim optional",note:"This is what nimbu pani is. Don't overthink it. The salt is non-negotiable — it rounds every flavour out. Every Indian guest will reach for this."},
{name:"Vodka Tonic",base:["vodka"],type:["classic"],season:["summer","monsoon"],complexity:1,glass:"Highball",chill:false,
 ing:["vodka","tonic"],ratio:[["Vodka","1"],["Tonic","3"]],method:"Build over ice. Tonic gently down the side.",garnish:"Lime wedge",note:""},

/* ── WHISKY ────────────────────────────────────────── */
{name:"Whisky Neat",base:["whisky"],type:["classic"],season:["winter","monsoon"],complexity:1,glass:"Lowball",chill:true,
 ing:["whisky"],ratio:[["Teacher's 50","60ml"]],method:"Chilled lowball. Pour. Let it breathe 30 seconds.",garnish:"None",note:"No interference. This is the drink."},
{name:"Whisky on the Rock",base:["whisky"],type:["classic"],season:["winter","monsoon"],complexity:1,glass:"Lowball",chill:false,
 ing:["whisky"],ratio:[["Teacher's 50","2"],["Ice","1 large cube"]],method:"One large cube in chilled lowball. Pour whisky over slowly.",garnish:"Expressed lemon peel optional",note:"One cube only — controls dilution, melts slower."},
{name:"Whisky Highball",base:["whisky"],type:["classic"],season:["summer","monsoon","winter"],complexity:1,glass:"Highball",chill:false,
 ing:["whisky","soda"],ratio:[["Teacher's 50","1"],["Chilled soda","3"]],method:"Prepare the glass and the garnish first. Cut a lemon peel — a good wide strip using the Y-peeler. Set it aside. Chill the highball glass if possible. Fill the glass completely with ice — all the way to the brim. Pour the whisky over the ice, let it settle. Open your soda immediately before pouring — carbonation starts dying the moment it's open. Pour the soda slowly down the side of the tilted glass. Hold the lemon peel skin-side down over the glass, give it a firm pinch — spray the oils across the entire surface. Wipe the rim with the peel. Drop it in. One single gentle stir with the bar spoon and stop.",garnish:"Expressed lemon peel — cut before ice goes in, expressed at the very end",note:"The pour technique is the whole thing — soda directly onto ice kills carbonation in seconds. The lemon express transforms the aroma of the drink entirely."},
{name:"Old Fashioned",base:["whisky"],type:["classic"],season:["winter"],complexity:3,glass:"Lowball",chill:true,
 ing:["whisky","simple syrup","bitters"],ratio:[["Teacher's 50","8"],["Simple syrup","1"],["Angostura bitters","2 dashes"]],method:"Before anything else — cut a wide orange peel and set it aside. Chill the lowball glass. Add 2 dashes Angostura and the simple syrup to the glass first. Add a small splash of whisky and stir just enough to dissolve the syrup — this is your base. Now add one large cube of ice. Pour the rest of the whisky over the cube. Stir slowly with the bar spoon, 20-25 rotations — you are chilling and diluting, not mixing aggressively. Hold the orange peel skin-side down over the glass surface, give it a sharp pinch to spray the oils. Wipe the peel around the rim of the glass — every inch of it. Drop the peel in. Serve immediately.",garnish:"Wide expressed orange peel — prepared before you start, wiped around the full rim",note:"This drink is about ritual as much as recipe. Do not rush the stir. Do not shake it. The orange peel express is not optional — it changes the aroma entirely. Requires Angostura."},
{name:"Rob Roy",base:["whisky"],type:["classic"],season:["winter"],complexity:3,glass:"Cocktail glass",chill:true,
 ing:["whisky","sweet vermouth","bitters"],ratio:[["Scotch whisky","2"],["Sweet vermouth","1"],["Angostura bitters","2 dashes"]],method:"Stir over ice 30 seconds. Strain into chilled cocktail glass.",garnish:"Expressed orange peel or cherry",note:"A Manhattan made with Scotch. Teacher's 50 works very well here. Requires Angostura."},
{name:"Whisky Sour",base:["whisky"],type:["classic"],season:["monsoon","winter"],complexity:2,glass:"Lowball",chill:false,
 ing:["whisky","lime","simple syrup"],ratio:[["Teacher's 50","2"],["Fresh lime","1"],["Simple syrup","0.75"]],method:"Cut a lime wheel and set it aside — garnish first. Add whisky, fresh lime juice, simple syrup to the shaker. Fill with ice. Shake very hard for 12 seconds. Fine strain into a lowball glass over fresh ice. Lay the lime wheel flat on top of the drink — do not perch it on the rim, lay it flat so it floats. If you have Angostura, add 2 dashes across the lime wheel in a zigzag — the orange-brown against the green wheel is a classic finish.",garnish:"Lime wheel laid flat on top of the drink — placed before the Angostura dash",note:"One of the most satisfying drinks in existence. Teacher's 50 holds up beautifully here. The Angostura zigzag on the floating lime wheel is a visual signature — do it every time."},
{name:"Penicillin",base:["whisky"],type:["classic"],season:["winter"],complexity:3,glass:"Lowball",chill:false,
 ing:["whisky","honey","ginger","lime"],ratio:[["Blended Scotch","2"],["Honey-ginger syrup","1"],["Fresh lime","0.75"]],method:"Make honey-ginger syrup — simmer 2:1 honey-water with grated ginger 5 mins, strain, cool. Shake all with ice. Strain into lowball over large cube.",garnish:"Candied ginger",note:"One of the great modern classics. Teacher's 50 works as the blended Scotch. The honey-ginger syrup is a batch to keep in fridge."},
{name:"Adrak Highball",base:["whisky"],type:["indian","signature"],season:["winter","monsoon"],complexity:2,glass:"Highball",chill:false,
 ing:["whisky","ginger","honey","soda"],ratio:[["Teacher's 50","2"],["Fresh ginger juice","0.5"],["Honey syrup","0.5"],["Soda","3"]],method:"Grate fresh ginger, squeeze through cloth or strainer. Build over ice — whisky, ginger juice, honey syrup, top soda gently.",garnish:"Thin ginger slice or candied ginger",note:"Adrak means ginger. Pune winter evenings. Sharp ginger heat against Teacher's malt is exactly right."},
{name:"Chai Old Fashioned",base:["whisky"],type:["indian","signature"],season:["winter"],complexity:3,glass:"Lowball",chill:true,
 ing:["whisky","chai","simple syrup","bitters"],ratio:[["Teacher's 50","8"],["Masala chai syrup","1"],["Angostura bitters","2 dashes"]],method:"Brew strong chai with cardamom, cinnamon, clove, ginger. Strain, add equal sugar, dissolve, cool. Build Old Fashioned method with chai syrup instead of simple syrup.",garnish:"Expressed orange peel, cinnamon stick",note:"Project drink — takes effort, result is extraordinary. Make syrup in batches, refrigerate. Cardamom and whisky is a natural Indian pairing."},
{name:"Thandai Whisky",base:["whisky"],type:["indian","signature"],season:["winter"],complexity:3,glass:"Lowball",chill:false,
 ing:["whisky","milk","almonds","cardamom","saffron","rose"],ratio:[["Teacher's 50","2"],["Thandai syrup","1"],["Chilled milk","1"]],method:"Make thandai syrup — blend almonds, fennel, cardamom, rose petals, saffron, sugar, strain. Shake whisky and thandai syrup with ice, strain into glass with one cube, float chilled milk.",garnish:"Pinch of saffron, rose petal",note:"Holi season drink. Thandai syrup available ready-made in winter. Extraordinary when made well."},
{name:"Ginger Whisky Sour",base:["whisky"],type:["indian","signature"],season:["monsoon","winter"],complexity:2,glass:"Lowball",chill:false,
 ing:["whisky","ginger","honey","lime"],
 ratio:[["Teacher's 50","2"],["Fresh ginger juice","0.5"],["Honey syrup","0.75"],["Fresh lime","1"]],
 method:"Shake hard with ice — everything together. Fine strain into lowball over fresh ice.",garnish:"Thin ginger slice, lime wheel",note:"Distinct from the Adrak Highball — this is a shaken sour, much colder and more rounded. The honey softens the ginger heat into something very drinkable. Monsoon staple."},

/* ── RUM ───────────────────────────────────────────── */
{name:"Daiquiri",base:["rum"],type:["classic"],season:["summer"],complexity:2,glass:"Cocktail glass",chill:true,
 ing:["rum","lime","simple syrup"],ratio:[["White rum","3"],["Fresh lime","1"],["Simple syrup","0.5"]],method:"Freeze the cocktail glass 20 mins prior — it should be cold to the touch when you pull it out. Cut a thin lime wheel and set it on the bar. Juice the lime fresh. Add rum, lime juice, simple syrup to the shaker. Fill with ice right to the top. Shake harder and longer than you think — 12-15 seconds, the shaker should frost over. Fine strain in one clean pour into the frosted glass. Balance the lime wheel on the rim — don't drop it in, balance it.",garnish:"Thin lime wheel balanced on the rim — prepared before you shake",note:"The holy trinity. Rock Paper Rum Coastal White is ideal. A warm glass ruins this drink. The visual of the lime wheel balanced perfectly on the rim is your restaurant tell."},
{name:"Mojito",base:["rum"],type:["classic"],season:["summer","monsoon"],complexity:2,glass:"Highball",chill:false,
 ing:["rum","lime","simple syrup","soda","mint"],ratio:[["White rum","3"],["Fresh lime","1"],["Simple syrup","1"],["Soda","3"],["Mint","8-10 leaves"]],method:"Prepare your garnish first — pick a perfect mint sprig, the fullest one, set it aside. Take your mint leaves and slap them once between your palms firmly — this wakes the oils without bruising. Drop them into the glass. Cut your lime into wedges and squeeze them over the mint — juice directly onto the mint, not the glass. Add simple syrup. Muddle gently 3-4 slow presses — you are pressing for oil extraction, not grinding. Add rum. Fill the glass with crushed ice or regular ice packed tightly. Top with cold soda slowly down the side. Slap the reserved mint sprig one more time and tuck it into the ice beside the straw so the nose hits mint on every sip.",garnish:"Full mint sprig tucked into ice — slapped twice, prepared before muddling starts",note:"Over-muddling is the single most common mistake. 3-4 gentle presses only. The double slap of the garnish mint is what separates a bartender's Mojito from everyone else's."},
{name:"Daiquiri (Hemingway)",base:["rum"],type:["classic"],season:["summer"],complexity:2,glass:"Cocktail glass",chill:true,
 ing:["rum","lime","grapefruit","triple sec"],ratio:[["White rum","3"],["Lime","1"],["Grapefruit juice","0.5"],["Triple sec","0.5"]],method:"Shake hard with ice. Fine strain into chilled cocktail glass.",garnish:"Lime wheel",note:"Papa Hemingway's drink — drier than a classic Daiquiri. Grapefruit on demand. Triple sec earns its keep here."},
{name:"El Presidente",base:["rum"],type:["classic"],season:["monsoon","winter"],complexity:3,glass:"Cocktail glass",chill:true,
 ing:["rum","triple sec","grenadine","vermouth"],ratio:[["White rum","2"],["Triple sec","0.5"],["Grenadine","0.25"],["Dry vermouth","0.5"]],method:"Stir over ice 30 seconds. Strain into chilled cocktail glass.",garnish:"Expressed orange peel",note:"Stirred rum cocktail — underrated and elegant. Grenadine on demand."},
{name:"Planter's Punch",base:["rum"],type:["classic"],season:["summer","monsoon"],complexity:2,glass:"Highball",chill:false,
 ing:["rum","lime","simple syrup","orange juice","soda"],ratio:[["Dark rum","2"],["Lime","1"],["Simple syrup","0.75"],["Orange juice","2"],["Soda","1"]],method:"Shake rum, lime, syrup, OJ with ice. Strain into ice-filled highball. Top soda.",garnish:"Orange wheel, lime wedge",note:"Old Monk works beautifully here. Tropical and generous."},
{name:"Kokum Daiquiri",base:["rum"],type:["indian","signature"],season:["summer","monsoon"],complexity:2,glass:"Cocktail glass",chill:true,
 ing:["rum","kokum syrup","lime","simple syrup"],ratio:[["White rum","3"],["Kokum syrup","0.75"],["Fresh lime","0.75"],["Simple syrup","0.25"]],method:"Shake hard with ice. Fine strain into chilled cocktail glass. Taste before adding syrup — kokum carries tartness.",garnish:"Dried kokum or lime wheel",note:"Deep purple colour is stunning. Kokum and rum share a tropical profile — natural pairing."},
{name:"Hibiscus Rum Cooler",base:["rum"],type:["indian","signature"],season:["summer","monsoon"],complexity:2,glass:"Highball",chill:false,
 ing:["rum","hibiscus","lime","simple syrup","soda"],ratio:[["White rum","2"],["Hibiscus cold brew","1"],["Lime","0.75"],["Simple syrup","0.5"],["Soda","2"]],method:"Cold brew dried hibiscus — steep in cold water 4-6 hrs. Build over ice, shake rum, hibiscus brew, lime, syrup. Strain into highball, top soda.",garnish:"Hibiscus flower if available, lime wheel",note:"Dried gudhal flowers at any kirana or pansari. Stunning deep crimson colour. Natural sourness means less lime needed — taste as you go."},
{name:"Old Monk Neat",base:["rum"],type:["classic"],season:["winter","monsoon"],complexity:1,glass:"Lowball",chill:false,
 ing:["rum"],ratio:[["Old Monk","60ml"]],method:"Pour. Serve.",garnish:"None",note:"Some things don't need help."},
{name:"Old Monk & Cola",base:["rum"],type:["classic"],season:["summer","monsoon","winter"],complexity:1,glass:"Highball",chill:false,
 ing:["rum","cola","lime"],ratio:[["Old Monk","1"],["Cola","3"],["Lime","squeeze"]],method:"Build over ice. Lime squeeze. Drop in.",garnish:"Lime wedge",note:"This is what most guests will want. Cold glass, fresh ice, cold cola poured gently."},
{name:"Dark & Stormy",base:["rum"],type:["classic"],season:["monsoon"],complexity:1,glass:"Highball",chill:false,
 ing:["rum","lime","ginger beer"],ratio:[["Old Monk","2"],["Fresh lime","1"],["Ginger beer","4"]],method:"Build over ice. Lime squeeze. Top ginger beer — pour gently to float on top.",garnish:"Lime wedge",note:"Old Monk against ginger beer is exactly right. The monsoon drink."},
{name:"Rum Old Fashioned",base:["rum"],type:["classic"],season:["winter"],complexity:3,glass:"Lowball",chill:true,
 ing:["rum","simple syrup","bitters"],ratio:[["Old Monk","8"],["Simple syrup","1"],["Angostura bitters","2 dashes"]],method:"Add bitters and syrup. Stir. Add rum. Large cube. Stir 20 rotations. Express orange peel.",garnish:"Expressed orange peel",note:"Old Monk has enough character to carry an Old Fashioned. Underrated move."},
{name:"Coconut Rum Cooler",base:["rum"],type:["indian"],season:["summer"],complexity:2,glass:"Highball",chill:false,
 ing:["rum","coconut water","lime","simple syrup"],ratio:[["White rum","2"],["Fresh coconut water","3"],["Lime","0.75"],["Simple syrup","0.25"]],method:"Build over ice. Pour rum, coconut water, lime, syrup. Stir gently.",garnish:"Lime wedge",note:"Fresh coconut water only — packaged versions are too sweet. A Pune summer drink that needs no introduction."},
{name:"Chai Rum",base:["rum"],type:["indian","signature"],season:["monsoon","winter"],complexity:2,glass:"Irish glass or mug",chill:false,
 ing:["rum","chai","milk","sugar"],
 ratio:[["Old Monk","2"],["Strong masala chai","4"],["Milk","1"]],
 method:"Brew strong masala chai — double strength. Warm the glass with hot water, discard. Pour rum in first. Top with hot chai. Float a small pour of milk.",garnish:"Cardamom pod, small pinch of ground cardamom on top",note:"The desi Irish Coffee. Nobody asks for it — everyone who gets it asks for another. Monsoon evenings only. Don't sweeten the chai too much; the Old Monk carries the sweetness."},

/* ── TEQUILA ───────────────────────────────────────── */
{name:"Margarita",base:["tequila"],type:["classic","future"],season:["summer"],complexity:2,glass:"Lowball or Cocktail glass",chill:true,
 ing:["tequila","triple sec","lime"],
 ratio:[["Blanco tequila","2"],["Triple sec","1"],["Fresh lime","1"]],
 method:"Shake hard with ice. Fine strain into chilled glass. Salt rim optional — wipe half the rim with lime, press into salt.",garnish:"Salt rim, lime wheel",note:"Future bar — needs a blanco tequila. Patrón Silver or even local options work. Do not make this with bad tequila. The quality of the lime matters enormously. This is one of the most ordered cocktails in Pune bars right now."},
{name:"Paloma",base:["tequila"],type:["classic","future"],season:["summer"],complexity:1,glass:"Highball",chill:false,
 ing:["tequila","lime","grapefruit soda","salt"],
 ratio:[["Blanco tequila","2"],["Fresh lime","0.5"],["Grapefruit soda","4"],["Salt","pinch"]],
 method:"Build over ice. Pour tequila, squeeze lime, add salt. Top grapefruit soda gently — Sting works if you can't find proper grapefruit soda.",garnish:"Lime wheel, salt rim optional",note:"Future bar — easier than a Margarita and arguably more refreshing. The Paloma has overtaken the Margarita in Mexico and it's getting there in India. Sting grapefruit works as a substitute. Light, citrus-forward, summer."},
{name:"Tequila Sour",base:["tequila"],type:["classic","future"],season:["summer","monsoon"],complexity:2,glass:"Lowball",chill:false,
 ing:["tequila","lime","simple syrup"],
 ratio:[["Blanco tequila","2"],["Fresh lime","1"],["Simple syrup","0.75"]],
 method:"Shake hard with ice. Strain into lowball over fresh ice.",garnish:"Lime wheel",note:"Future bar. Essentially a Daiquiri structure. Clean, sharp, honest. Lets the tequila speak."},

/* ── BRANDY ────────────────────────────────────────── */
{name:"Brandy Soda",base:["brandy"],type:["classic"],season:["winter","monsoon"],complexity:1,glass:"Highball",chill:false,
 ing:["brandy","soda"],ratio:[["St Remy VSOP","1"],["Soda","2"]],method:"Build over ice. Soda down the side.",garnish:"Lime wedge optional",note:"Most brandy drinkers in India want exactly this."},
{name:"Brandy Neat",base:["brandy"],type:["classic"],season:["winter"],complexity:1,glass:"Lowball",chill:false,
 ing:["brandy"],ratio:[["St Remy VSOP","60ml"]],method:"Room temperature glass. Pour. Let guests lead.",garnish:"None",note:""},
{name:"Sidecar",base:["brandy"],type:["classic"],season:["winter"],complexity:3,glass:"Cocktail glass",chill:true,
 ing:["brandy","triple sec","lime"],ratio:[["St Remy VSOP","2"],["Triple sec","1"],["Fresh lime","1"]],method:"Shake with ice. Fine strain into chilled cocktail glass. Optional sugar rim.",garnish:"Expressed lemon peel",note:"Classic most people haven't tried. St Remy handles this well."},
{name:"Brandy Alexander",base:["brandy"],type:["classic"],season:["winter"],complexity:2,glass:"Cocktail glass",chill:true,
 ing:["brandy","triple sec","cream"],ratio:[["St Remy VSOP","2"],["Triple sec","1"],["Fresh cream","1"]],method:"Shake with ice. Fine strain into chilled cocktail glass.",garnish:"Fresh grated nutmeg on top",note:"Rich and indulgent. A dessert cocktail. Fresh cream only — not UHT."},
{name:"Between the Sheets",base:["brandy","rum"],type:["classic"],season:["monsoon","winter"],complexity:2,glass:"Cocktail glass",chill:true,
 ing:["brandy","rum","triple sec","lime"],ratio:[["Brandy","1"],["White rum","1"],["Triple sec","1"],["Lime","0.5"]],method:"Shake hard with ice. Fine strain into chilled cocktail glass.",garnish:"Lemon twist",note:"Equal-parts cocktail. Brandy and rum together sounds odd, works brilliantly."},
{name:"Stinger",base:["brandy"],type:["classic"],season:["winter"],complexity:2,glass:"Lowball",chill:false,
 ing:["brandy","peppermint","mint"],ratio:[["St Remy VSOP","2"],["Peppermint syrup or fresh mint","0.75"]],method:"Stir over ice. Strain into lowball over large cube.",garnish:"Fresh mint sprig",note:"Peppermint syrup from any baking store. A winter after-dinner drink."},

/* ── WINE ──────────────────────────────────────────── */
{name:"Aperol Spritz",base:["wine"],type:["classic"],season:["summer","monsoon"],complexity:1,glass:"Wine glass",chill:false,
 ing:["aperol","sparkling wine","soda"],
 ratio:[["Prosecco or sparkling wine","3"],["Aperol","2"],["Soda","1"]],
 method:"Fill wine glass with ice. Pour Aperol. Top with cold prosecco gently. Splash of soda.",garnish:"Orange slice, inside the glass",note:"The default 'I don't know what I want' drink for Pune guests — especially evenings. Aperol is available at most liquor stores now. Bitter-sweet, low-alcohol, crowd-proof. Learn this one, it earns its keep."},
{name:"Kalimotxo (Simple)",base:["wine"],type:["classic"],season:["summer","monsoon"],complexity:1,glass:"Highball",chill:false,
 ing:["wine","cola","lime"],ratio:[["Red wine","1"],["Cola","1"],["Lime","squeeze"]],method:"Fill glass with ice. Pour wine, pour cola gently. Squeeze lime.",garnish:"Lime wedge",note:"Don't spend on the wine — you're mixing it with cola."},
{name:"Kalimotxo (Elevated)",base:["wine"],type:["signature"],season:["summer","monsoon"],complexity:2,glass:"Highball",chill:false,
 ing:["wine","craft cola","lime"],ratio:[["Tempranillo","1"],["Craft cola","1"],["Lime","squeeze"]],method:"Fill glass with ice. Pour wine. Add craft cola gently. Lime squeeze. Express orange peel over top. Place rosemary sprig.",garnish:"Fresh rosemary, expressed orange peel",note:"Svami or Sepoy craft cola only. Rosemary-Tempranillo combination is a genuine surprise."},
{name:"Spritzer",base:["wine"],type:["classic"],season:["summer"],complexity:1,glass:"Wine glass",chill:false,
 ing:["wine","soda"],ratio:[["Sauvignon Blanc","3"],["Soda","1"]],method:"Very cold wine into chilled glass. Light soda top. Serve immediately.",garnish:"Lemon wheel",note:""},
{name:"Kir",base:["wine"],type:["classic"],season:["monsoon","winter"],complexity:1,glass:"Wine glass",chill:false,
 ing:["wine","berry syrup"],ratio:[["Dry white wine","4"],["Cassis or berry syrup","0.5"]],method:"Pour berry syrup into glass first. Top with cold white wine. Do not stir.",garnish:"None",note:"Cassis (blackcurrant liqueur) is traditional — substitute blackberry or blueberry syrup for a home bar version."},
{name:"Sangria",base:["wine"],type:["classic"],season:["summer","monsoon"],complexity:2,glass:"Highball or pitcher",chill:false,
 ing:["wine","triple sec","orange juice","lime","simple syrup","soda"],ratio:[["Red wine","4"],["Triple sec","0.5"],["OJ","1"],["Lime juice","0.5"],["Simple syrup","0.5"],["Soda","1"]],method:"Mix wine, triple sec, OJ, lime, syrup in pitcher. Refrigerate 30 mins minimum. Add soda and ice when serving.",garnish:"Orange and lime slices in the pitcher",note:"Batch drink — make in a pitcher. Improves with 30-60 mins rest in fridge. Great for a group."},
{name:"Wine Neat",base:["wine"],type:["classic"],season:["summer","winter"],complexity:1,glass:"Wine glass",chill:false,
 ing:["wine"],ratio:[["Wine","one pour"]],method:"Sauvignon Blanc — very cold, white wine glass. Shiraz — room temperature, red wine glass.",garnish:"None",note:"No garnish, no ice in the wine. Serve correctly and step back."},

/* ── BEER ──────────────────────────────────────────── */
{name:"Beer Straight",base:["beer"],type:["classic"],season:["summer","monsoon"],complexity:1,glass:"Pilsner",chill:false,
 ing:["beer"],ratio:[["Craft beer","1 bottle"]],method:"Rinse pilsner glass with cold water. Tilt 45°, pour down the side. Straighten toward end to build a finger of head.",garnish:"None",note:"Kölsch and Basmati Blonde — summer. Carlsberg Elephant — when you want strength."},
{name:"Beer & Lime",base:["beer"],type:["classic"],season:["summer","monsoon"],complexity:1,glass:"Pilsner",chill:false,
 ing:["beer","lime","kala namak"],ratio:[["Beer","1"],["Lime","squeeze"],["Kala namak","pinch"]],method:"Pour cold beer into rinsed glass. Squeeze fresh lime over the top. Optional pinch of kala namak.",garnish:"Lime wedge on rim",note:"The most honest summer drink in India. Kala namak takes it somewhere special."},
{name:"Michelada",base:["beer"],type:["classic","indian"],season:["summer"],complexity:2,glass:"Pilsner",chill:false,
 ing:["beer","lime","kala namak","chaat masala","tabasco"],ratio:[["Beer","1 bottle"],["Lime","1"],["Kala namak","pinch"],["Chaat masala","pinch"],["Tabasco","3 dashes"]],method:"Rim glass with lime and kala namak mix. Add lime juice, tabasco, chaat masala. Pour cold beer slowly over.",garnish:"Lime wheel on rim",note:"The Indian Michelada — uses chaat masala instead of Worcestershire. Surprisingly good."},
{name:"Shandy",base:["beer"],type:["classic"],season:["summer"],complexity:1,glass:"Pilsner",chill:false,
 ing:["beer","lime soda","lime"],ratio:[["Kölsch","1"],["Lime soda","1"],["Lime","squeeze"]],method:"Pour chilled beer. Top lime soda gently. Lime squeeze.",garnish:"Lime wedge",note:"Kölsch is light enough not to fight the soda."},

/* ── NEW CLASSICS ──────────────────────────────────── */
{name:"Paper Plane",base:["whisky"],type:["classic"],season:["monsoon","winter"],complexity:3,glass:"Cocktail glass",chill:true,
 ing:["whisky","triple sec","lime","bitters"],
 ratio:[["Blended Scotch","1"],["Triple sec","1"],["Fresh lime","1"],["Aperol or Campari","1"]],
 method:"Cut a lemon twist and set it aside. Add all four ingredients in equal parts to the shaker. Fill with ice. Shake very hard for 12 seconds — equal-parts drinks need aggressive integration. Fine strain into chilled cocktail glass. Express the lemon twist over the surface, drop in.",garnish:"Expressed lemon twist — cut before you start",note:"One of the greatest modern classics. The equal-parts structure means every ingredient is equal — use a jigger religiously here. Teacher's 50 works well. Future bar for Aperol, but triple sec gives a different but acceptable result."},
{name:"Naked & Famous",base:["whisky"],type:["classic"],season:["winter"],complexity:3,glass:"Cocktail glass",chill:true,
 ing:["whisky","triple sec","lime"],
 ratio:[["Blended Scotch","1"],["Triple sec","1"],["Fresh lime","1"],["Simple syrup","0.5"]],
 method:"Chill the glass. Shake whisky, triple sec, lime juice, syrup with ice hard. Fine strain into chilled cocktail glass.",garnish:"Expressed orange peel",note:"Paper Plane's sibling — a little more approachable. Good gateway cocktail for whisky-curious guests."},
{name:"Corpse Reviver No.2",base:["gin"],type:["classic"],season:["summer","monsoon"],complexity:3,glass:"Cocktail glass",chill:true,
 ing:["gin","triple sec","lime","vermouth"],
 ratio:[["Gin","1"],["Triple sec","1"],["Dry vermouth","1"],["Fresh lime","1"]],
 method:"Chill the glass thoroughly. Add equal parts gin, triple sec, dry vermouth, fresh lime to shaker. Fill with ice. Shake hard for 12 seconds. Fine strain into the frosted glass. A tiny drop of absinthe or anise spirit rinsed around the glass beforehand is traditional — skip if unavailable.",garnish:"Expressed lemon peel",note:"Classic equal-parts aperitif cocktail. Bright, sour, herbal. A great starter drink."},
{name:"Jungle Bird",base:["rum"],type:["classic"],season:["summer","monsoon"],complexity:2,glass:"Lowball",chill:false,
 ing:["rum","triple sec","lime","simple syrup","orange juice"],
 ratio:[["Dark rum","2"],["Triple sec","0.75"],["Fresh lime","0.75"],["OJ","1"],["Simple syrup","0.5"]],
 method:"Cut an orange wheel and set it aside. Add all to shaker. Shake hard with ice. Strain into lowball over fresh ice. Lay the orange wheel flat on top.",garnish:"Orange wheel laid flat on drink surface",note:"Old Monk is perfect here. A tropical rum cocktail with enough bitterness from the triple sec and lime to stop it being sweet. Summer evenings."},
{name:"Trinidad Sour",base:["whisky"],type:["classic"],season:["winter"],complexity:3,glass:"Cocktail glass",chill:true,
 ing:["whisky","bitters","lime","honey","simple syrup"],
 ratio:[["Angostura bitters","1"],["Teacher's 50","0.75"],["Honey syrup","0.75"],["Fresh lime","0.5"]],
 method:"Chill the glass. Yes — Angostura is the primary ingredient here, not a dash. Add all to shaker. Shake hard with ice 12 seconds. Fine strain into chilled cocktail glass.",garnish:"Expressed orange peel",note:"The drink where Angostura is the base spirit. It sounds insane and tastes extraordinary. Complex, bitter, spiced, layered. Only for the curious."},
{name:"Bamboo",base:["wine"],type:["classic"],season:["monsoon","winter"],complexity:2,glass:"Cocktail glass",chill:true,
 ing:["wine","vermouth","bitters"],
 ratio:[["Dry sherry or dry white wine","1"],["Dry vermouth","1"],["Angostura bitters","2 dashes"]],
 method:"Chill the glass. Add wine, vermouth, bitters to a mixing glass with lots of ice. Stir 30 rotations — slow and deliberate. Strain into chilled cocktail glass.",garnish:"Expressed lemon peel",note:"A low-alcohol stirred cocktail. Sophisticated, dry, aromatic. Excellent for guests who want something elegant but lighter."},
{name:"Espresso Martini",base:["vodka"],type:["classic"],season:["monsoon","winter"],complexity:3,glass:"Cocktail glass",chill:true,
 ing:["vodka","triple sec","coffee","simple syrup"],
 ratio:[["Vodka","2"],["Strong cold espresso or cold brew coffee","1"],["Triple sec","0.5"],["Simple syrup","0.25"]],
 method:"Freeze the glass. Brew espresso and let it cool completely — or use good quality cold brew. Add vodka, cold coffee, triple sec, syrup to shaker. Fill with lots of ice. Shake VERY hard for 15 seconds — you are building a foam layer. Fine strain into frosted glass in one single pour without stopping. The foam settles on top.",garnish:"3 coffee beans placed in a triangle on the foam — do this immediately before serving",note:"The foam is the signature. It only forms with cold coffee and vigorous shaking. Three beans in a triangle is tradition — health, wealth, happiness. If the foam collapses, your coffee was too warm. Triple sec substitutes for Kahlua — different profile but works."},
{name:"Paloma",base:["tequila"],type:["classic","future"],season:["summer"],complexity:1,glass:"Highball",chill:false,
 ing:["tequila","lime","grapefruit soda","salt"],
 ratio:[["Blanco tequila","2"],["Fresh lime","0.5"],["Grapefruit soda","4"],["Salt","pinch"]],
 method:"Cut a lime wheel and press it inside the glass before ice. Rim half the glass with salt — run the cut lime around just half the rim, dip into salt. Fill glass with ice. Pour tequila. Squeeze lime. Add a pinch of salt. Top grapefruit soda slowly down the side. One slow stir.",garnish:"Lime wheel pressed inside glass before ice, salt half-rim",note:"Future bar. Easier than a Margarita and arguably more refreshing. Sting grapefruit works as a substitute. The half salt rim means every sip is different — the guest controls the salinity."},

/* ── NEW GIN ───────────────────────────────────────── */
{name:"Southside",base:["gin"],type:["classic"],season:["summer"],complexity:2,glass:"Cocktail glass",chill:true,
 ing:["gin","lime","simple syrup","mint"],
 ratio:[["Gin","3"],["Fresh lime","1"],["Simple syrup","0.75"],["Mint","6-8 leaves"]],
 method:"Freeze the cocktail glass. Pick your garnish mint sprig and set aside. Add mint leaves, lime juice, syrup to shaker and muddle gently — 3 presses only. Add gin and ice. Shake hard 12 seconds. Double strain through both strainers into the frosted glass — you want zero mint debris. Slap the garnish mint and place it on top.",garnish:"Slapped mint sprig laid on top of the drink",note:"A Gimlet with mint. Clean, cold, stunning. The double strain is mandatory — no mint shreds in a chilled cocktail."},
{name:"Last Word",base:["gin"],type:["classic"],season:["monsoon","winter"],complexity:3,glass:"Cocktail glass",chill:true,
 ing:["gin","lime","triple sec","simple syrup"],
 ratio:[["Gin","1"],["Green Chartreuse or triple sec","1"],["Maraschino or triple sec","1"],["Fresh lime","1"]],
 method:"Chill the glass. Equal parts — measure precisely. Shake hard with ice. Fine strain into frosted glass.",garnish:"Lime wheel on rim",note:"One of the greatest equal-parts cocktails. The herbal complexity is usually from Green Chartreuse — use triple sec as an accessible substitute that changes but doesn't ruin it."},
{name:"Bramble",base:["gin"],type:["classic"],season:["summer","monsoon"],complexity:2,glass:"Lowball",chill:false,
 ing:["gin","lime","simple syrup","berry syrup"],
 ratio:[["Gin","2"],["Fresh lime","1"],["Simple syrup","0.75"],["Blackberry or mixed berry syrup","0.5 float"]],
 method:"Cut a lime wheel garnish and set it aside. Build gin, lime, syrup over crushed ice or regular ice packed tight in the lowball. Stir briefly. Slowly drizzle the berry syrup over the back of the bar spoon so it creates a bleeding purple layer through the drink — do not mix it in. Place lime wheel on the side.",garnish:"Lime wheel on the side, fresh berry on top if available",note:"The purple-pink bleed through a clear gin drink is one of the most striking visuals behind a bar. Berry syrup from any good store works. Serve with a straw."},
{name:"Pegu Club",base:["gin"],type:["classic"],season:["summer","monsoon"],complexity:2,glass:"Cocktail glass",chill:true,
 ing:["gin","triple sec","lime","bitters"],
 ratio:[["Gin","3"],["Triple sec","1"],["Fresh lime","0.75"],["Angostura bitters","2 dashes"]],
 method:"Chill the glass. Add gin, triple sec, lime, bitters to shaker. Fill with ice. Shake hard. Fine strain into frosted cocktail glass.",garnish:"Expressed lime peel",note:"An older classic — gin-forward, slightly bitter, dry. Similar structure to a White Lady but with bitters adding depth. Very good with Greater Than."},

/* ── NEW VODKA ─────────────────────────────────────── */
{name:"Pornstar Martini",base:["vodka"],type:["classic"],season:["summer","monsoon"],complexity:2,glass:"Cocktail glass",chill:true,
 ing:["vodka","triple sec","passion fruit","lime","simple syrup"],
 ratio:[["Vodka","2"],["Triple sec","0.5"],["Passion fruit pulp or juice","1"],["Lime","0.5"],["Simple syrup","0.5"]],
 method:"Chill the glass and a shot glass. Add vodka, triple sec, passion fruit, lime, syrup to shaker. Fill with ice. Shake hard. Fine strain into frosted cocktail glass. Serve with a small shot of prosecco or sparkling wine on the side — the guest pours it in themselves.",garnish:"Half a passion fruit placed on top of the foam — or a lime wheel if passion fruit unavailable",note:"The prosecco shot on the side is the signature experience. Passion fruit pulp from the fruit directly or frozen. A crowd-pleasing elegant drink."},
{name:"Watermelon Vodka Spritz",base:["vodka"],type:["indian","signature"],season:["summer"],complexity:2,glass:"Highball",chill:false,
 ing:["vodka","watermelon","lime","simple syrup","soda"],
 ratio:[["Vodka","2"],["Fresh watermelon juice","2"],["Lime","0.5"],["Simple syrup","0.25"],["Soda","2"]],
 method:"Juice fresh watermelon by blending and straining. Set a watermelon triangle aside as garnish. Build over ice — vodka, watermelon juice, lime, syrup. Stir once. Top soda gently. Add garnish.",garnish:"Small watermelon triangle on rim — cut before juicing",note:"Summer only — May to July when watermelon is at peak. Fresh juice only, blended and strained. The colour in a highball glass is stunning. Light, hydrating, genuinely refreshing."},
{name:"Black Russian",base:["vodka"],type:["classic"],season:["monsoon","winter"],complexity:1,glass:"Lowball",chill:false,
 ing:["vodka","coffee","simple syrup"],
 ratio:[["Vodka","2"],["Cold brew coffee or strong cold espresso","1"],["Simple syrup","0.25"]],
 method:"Build over ice in lowball. Pour vodka. Add cold coffee. Add syrup. Stir gently once with bar spoon.",garnish:"3 coffee beans",note:"The simpler ancestor of the Espresso Martini. Cold brew works beautifully. Kahlua is traditional but cold brew plus syrup is a legitimate home bar substitute."},

/* ── NEW WHISKY ────────────────────────────────────── */
{name:"Blood and Sand",base:["whisky"],type:["classic"],season:["monsoon","winter"],complexity:3,glass:"Cocktail glass",chill:true,
 ing:["whisky","triple sec","lime","orange juice"],
 ratio:[["Blended Scotch","1"],["Triple sec","1"],["OJ","1"],["Lime","0.5"]],
 method:"Chill the glass. Cut an orange twist and set it aside. Add whisky, triple sec, fresh orange juice, lime to shaker. Shake hard with ice. Fine strain into chilled cocktail glass. Express orange twist, drop in.",garnish:"Expressed orange twist — prepared before shaking",note:"A rarity — a Scotch cocktail with orange juice. Named after the 1922 Rudolph Valentino film. Teacher's 50 works. Unusual but very drinkable."},
{name:"Mamie Taylor",base:["whisky"],type:["classic"],season:["summer","monsoon"],complexity:1,glass:"Highball",chill:false,
 ing:["whisky","lime","ginger beer"],
 ratio:[["Blended Scotch","2"],["Fresh lime","0.75"],["Ginger beer","4"]],
 method:"Cut a lime wheel and set aside. Build over ice in highball. Squeeze lime, drop in spent shell. Pour whisky. Top ginger beer gently down the side. Place lime wheel on top.",garnish:"Lime wheel floating on top — placed before serving",note:"A Whisky Moscow Mule in structure. Lighter and more refreshing than a highball. Ginger beer on demand."},
{name:"Mint Julep",base:["whisky"],type:["classic"],season:["summer"],complexity:2,glass:"Lowball",chill:false,
 ing:["whisky","simple syrup","mint"],
 ratio:[["Bourbon or blended Scotch","2"],["Simple syrup","0.75"],["Mint","8-10 leaves"]],
 method:"Pick the fullest mint sprig and set it aside as garnish. Add remaining mint leaves and simple syrup to glass. Muddle gently — 4 slow presses. Fill glass completely with crushed ice. Pour whisky over the ice slowly. Stir briefly with bar spoon to chill. Pack more crushed ice on top to create a dome. Place the mint sprig so it emerges from the ice. The condensation on the outside of a Mint Julep is part of the experience — serve immediately.",garnish:"Full mint sprig emerging from the ice dome — prepared before muddling",note:"A summer whisky drink. Teacher's 50 works well. The garnish mint should be at nose level so the aroma hits before the sip. Classic Kentucky Derby drink."},

/* ── NEW RUM ────────────────────────────────────────── */
{name:"Rum Punch",base:["rum"],type:["classic"],season:["summer","monsoon"],complexity:1,glass:"Highball",chill:false,
 ing:["rum","lime","simple syrup","orange juice","grenadine"],
 ratio:[["White or dark rum","2"],["Fresh lime","1"],["Simple syrup","0.75"],["OJ","2"],["Grenadine","0.25"]],
 method:"Cut an orange wheel and set it aside. Build over ice — rum, lime, syrup, OJ, grenadine. Stir once. Place orange wheel on top.",garnish:"Orange wheel laid on top of the drink",note:"The bartender's rule — 1 of sour (lime), 2 of sweet (syrup), 3 of strong (rum), 4 of weak (OJ). This is the base equation. Rock Paper Rum or Old Monk both work."},
{name:"Caipirinha (Rum version)",base:["rum"],type:["classic"],season:["summer"],complexity:2,glass:"Lowball",chill:false,
 ing:["rum","lime","simple syrup"],
 ratio:[["White rum","3"],["Lime","1"],["Simple syrup","1"]],
 method:"Cut the lime into 8 small wedges. Place wedges into the glass. Add simple syrup. Muddle the lime firmly — you want both juice and the oils from the peel. Fill with crushed ice or ice packed tight. Pour rum over. Stir briskly.",garnish:"Lime wedge resting on ice",note:"Technically a Caipirinha uses cachaça (Brazilian sugarcane spirit), but white rum gives you the same structure. Rock Paper Rum Coastal White is ideal. Muddle the lime harder here than a Mojito — you want the peel oils."},
{name:"Pina Colada",base:["rum"],type:["classic"],season:["summer"],complexity:2,glass:"Highball",chill:false,
 ing:["rum","coconut","pineapple","simple syrup"],
 ratio:[["White rum","2"],["Coconut milk or coconut cream","1"],["Pineapple juice","2"],["Simple syrup","0.25"]],
 method:"Add all to shaker with plenty of ice. Shake very hard for 15 seconds — coconut needs aggressive mixing. Pour unstrained into a highball glass with ice. Or blend everything with ice for a frozen version.",garnish:"Pineapple wedge on rim if available, or lime wheel",note:"Pineapple and coconut water on demand. Coconut milk instead of cream for a lighter version. A genuinely difficult drink to make poorly — forgiving and crowd-pleasing."},

/* ── NEW BRANDY ─────────────────────────────────────── */
{name:"Vieux Carré",base:["brandy","whisky"],type:["classic"],season:["winter"],complexity:3,glass:"Lowball",chill:true,
 ing:["brandy","whisky","vermouth","bitters"],
 ratio:[["St Remy VSOP","1"],["Teacher's 50","1"],["Sweet vermouth","1"],["Angostura bitters","2 dashes"]],
 method:"Chill the lowball. Add brandy, whisky, sweet vermouth, bitters to mixing glass with ice. Stir 30 rotations — slow and deliberate. Place large ice cube in chilled lowball. Strain over the cube.",garnish:"Expressed orange peel, wiped on rim",note:"New Orleans classic — brandy and Scotch split the base. The combination of St Remy and Teacher's 50 is genuinely excellent here. A serious winter drink."},
{name:"Chicago Fizz",base:["brandy","rum"],type:["classic"],season:["monsoon","winter"],complexity:2,glass:"Highball",chill:false,
 ing:["brandy","rum","lime","simple syrup","soda"],
 ratio:[["Brandy","1"],["White rum","1"],["Fresh lime","0.75"],["Simple syrup","0.5"],["Soda","3"]],
 method:"Cut a lime wheel and press inside the highball glass before ice. Fill with ice. Shake brandy, rum, lime, syrup with ice. Strain into the glass over ice. Top with soda down the side.",garnish:"Lime wheel pressed inside glass before ice",note:"Brandy and rum together again — different from Between the Sheets, longer and more refreshing. A crowd-pleaser that feels elegant."},

/* ── NEW WINE ───────────────────────────────────────── */
{name:"Tinto de Verano",base:["wine"],type:["classic"],season:["summer"],complexity:1,glass:"Highball",chill:false,
 ing:["wine","lime soda","lime"],
 ratio:[["Shiraz or Tempranillo","1"],["Lemon soda or Sprite","1"],["Lime","squeeze"]],
 method:"Cut a lemon wheel and set aside. Fill highball with ice. Pour red wine. Top lemon soda very gently. Squeeze lime. Place lemon wheel on top.",garnish:"Lemon wheel floating on top of the drink",note:"Spanish summer drink — lighter and sweeter than Kalimotxo, the soda is lemon not cola. Works especially well with Shiraz. An approachable wine drink for guests who find wine too serious."},
{name:"Glühwein",base:["wine"],type:["classic"],season:["winter"],complexity:2,glass:"Mug or wine glass",chill:false,
 ing:["wine","simple syrup","orange","cinnamon","clove"],
 ratio:[["Red wine","4"],["Simple syrup","0.5"],["Orange slices","2"],["Cinnamon sticks","2"],["Cloves","4"]],
 method:"Add wine, syrup, orange slices, cinnamon, cloves to a small pot. Warm over low heat — do not boil, ever. Simmer gently for 15 mins until the spices have infused. Strain into a warm mug.",garnish:"Cinnamon stick in the mug, orange slice on the side",note:"German mulled wine. Pune winters are mild but real enough for this on a cold December evening. Use Shiraz. Cloves from any kirana. Do not boil — boiling kills the wine and the alcohol."},

/* ── NEW INDIAN ─────────────────────────────────────── */
{name:"Paan Gin Fizz",base:["gin"],type:["indian","signature"],season:["monsoon","winter"],complexity:3,glass:"Highball",chill:false,
 ing:["gin","lime","simple syrup","soda","rose","cardamom"],
 ratio:[["Gin","2"],["Paan syrup or rose-cardamom syrup","1"],["Fresh lime","0.75"],["Soda","3"]],
 method:"Make paan-style syrup — dissolve sugar in water 1:1, add rose water, crushed cardamom, a few drops of kewra water if available, a pinch of mukhwas (fennel-anise mix). Strain, cool. Build over ice — gin, syrup, lime. Top soda gently. Stir once.",garnish:"Fresh rose petal, fennel seeds on top",note:"The after-dinner paan translated into a cocktail. Fragrant, unusual, deeply Indian. Paan syrup available at some specialty stores in Pune. Otherwise rose-cardamom syrup is the shortcut."},
{name:"Tamarind Whisky Sour",base:["whisky"],type:["indian","signature"],season:["summer","monsoon"],complexity:2,glass:"Lowball",chill:false,
 ing:["whisky","tamarind","lime","simple syrup","kala namak"],
 ratio:[["Teacher's 50","2"],["Tamarind concentrate","0.75"],["Fresh lime","0.5"],["Simple syrup","0.5"],["Kala namak","pinch"]],
 method:"Dissolve tamarind concentrate in a little warm water, strain any seeds. Add whisky, tamarind, lime, syrup to shaker. Fill with ice. Shake hard for 12 seconds. Fine strain into lowball over fresh ice. Add a tiny pinch of kala namak on top — do not stir in.",garnish:"Lime wheel, pinch of kala namak floating on top",note:"Tamarind and whisky is an extraordinary pairing — the sour-sweet depth of imli against Teacher's malt. Tamarind concentrate from any kirana. Kala namak on top is non-negotiable. Imli Sour is what you can call it for guests."},
{name:"Cardamom Old Fashioned",base:["whisky"],type:["indian","signature"],season:["winter"],complexity:3,glass:"Lowball",chill:true,
 ing:["whisky","cardamom syrup","bitters"],
 ratio:[["Teacher's 50","8"],["Cardamom simple syrup","1"],["Angostura bitters","2 dashes"]],
 method:"Make cardamom syrup — crush 6 green cardamom pods, simmer in 1:1 sugar-water 10 mins, strain, cool. Prepare wide orange peel garnish first. Build exactly as an Old Fashioned — bitters and syrup first, stir with a splash of whisky, large cube, rest of whisky, stir 20-25 rotations. Express orange peel over surface, wipe rim, drop in.",garnish:"Wide expressed orange peel — prepared before building the drink",note:"The Indian variation on the Old Fashioned. Cardamom and Scotch whisky is one of the great natural Indian pairings. The cardamom syrup keeps in the fridge for 2 weeks — make a batch."},
{name:"Kala Khatta Vodka",base:["vodka"],type:["indian","signature"],season:["summer"],complexity:1,glass:"Highball",chill:false,
 ing:["vodka","kokum syrup","lime","kala namak","soda"],
 ratio:[["Vodka","2"],["Kokum syrup","1"],["Fresh lime","0.5"],["Kala namak","pinch"],["Soda","3"]],
 method:"Cut a dried kokum piece or lime wheel for garnish. Build over ice — vodka, kokum syrup, lime, kala namak. Top soda gently. Place garnish.",garnish:"Dried kokum piece or lime wheel on rim",note:"Named after the kala khatta ice gola of every Indian childhood. The kokum-kala namak combination is deeply familiar and surprisingly sophisticated in a cocktail. Summer only."},
{name:"Masala Chai Rum",base:["rum"],type:["indian","signature"],season:["monsoon","winter"],complexity:2,glass:"Lowball",chill:false,
 ing:["rum","chai","honey","lime"],
 ratio:[["White rum","2"],["Masala chai syrup","1"],["Honey syrup","0.5"],["Fresh lime","0.5"]],
 method:"Make chai syrup — brew very strong masala chai with cardamom, ginger, cinnamon, clove. Strain, add equal sugar, dissolve. Cool. Shake rum, chai syrup, honey, lime with ice hard. Strain into lowball over fresh ice.",garnish:"Cinnamon stick, cardamom pod",note:"Different from the Chai Rum hot drink — this is a cold shaken cocktail. The white rum lets the chai spices come through more clearly than Old Monk would. A monsoon evening drink that surprises people."},
{name:"Nimbu Ginger Beer Mule",base:["vodka"],type:["indian","signature"],season:["summer","monsoon"],complexity:1,glass:"Highball",chill:false,
 ing:["vodka","lime","ginger beer","kala namak","mint"],
 ratio:[["Vodka","2"],["Fresh lime","1"],["Ginger beer","4"],["Kala namak","pinch"]],
 method:"Slap a mint sprig and set aside as garnish. Build over ice — vodka, lime squeeze, kala namak. Top ginger beer gently. Place mint garnish.",garnish:"Slapped mint sprig, lime wedge",note:"The Indian Moscow Mule. Kala namak instead of regular salt changes the profile completely — the sulphurous, tangy depth ties it to nimbu pani territory. Summer staple."},

/* ── BEERTINIS ──────────────────────────────────────── */
{name:"Classic Beertini",base:["beer","gin"],type:["classic"],season:["summer","monsoon"],complexity:2,glass:"Cocktail glass",chill:true,
 ing:["beer","gin","lime","simple syrup"],
 ratio:[["Gin","1"],["Cold light beer","2"],["Fresh lime","0.5"],["Simple syrup","0.25"]],
 method:"Freeze the cocktail glass. Add gin, lime, simple syrup to shaker with plenty of ice. Shake hard 10 seconds. Fine strain into the frosted glass — fill it halfway. Gently top with ice-cold light beer poured over the back of the bar spoon so the foam stays intact. Do not stir.",garnish:"Lime wheel balanced on rim — cut before you shake",note:"Kölsch or Basmati Blonde work beautifully here. The delicate beer foam on top of a gin sour base is the whole trick. Pour the beer as gently as you would a French 75 Champagne top."},
{name:"Shandy Martini",base:["beer","vodka"],type:["classic"],season:["summer"],complexity:2,glass:"Cocktail glass",chill:true,
 ing:["beer","vodka","lime","honey","ginger"],
 ratio:[["Vodka","1"],["Fresh ginger juice","0.25"],["Honey syrup","0.5"],["Lime","0.5"],["Cold Kölsch","2"]],
 method:"Freeze the cocktail glass. Juice fresh ginger through a cloth. Add vodka, ginger juice, honey syrup, lime to shaker with ice. Shake hard. Fine strain into frosted glass halfway. Top very gently with ice-cold Kölsch down the side of the tilted glass. The layers are the visual.",garnish:"Thin ginger slice on the rim, cut before shaking",note:"A summer beertini — the ginger-honey base under cold Kölsch is light and unusual. Kölsch only — heavier beers overwhelm it."},
{name:"Dark Monk Beertini",base:["beer","rum"],type:["indian","signature"],season:["monsoon","winter"],complexity:2,glass:"Cocktail glass",chill:true,
 ing:["beer","rum","cola","lime","simple syrup"],
 ratio:[["Old Monk","1"],["Cola","0.5"],["Lime","0.5"],["Simple syrup","0.25"],["Dark craft beer","1.5"]],
 method:"Freeze the glass. Add Old Monk, lime, simple syrup to shaker with ice. Shake hard. Fine strain into frosted cocktail glass — fill it halfway. Add a tiny splash of cold cola. Top with ice-cold Carlsberg Elephant or dark beer very gently. Do not stir — the layers matter.",garnish:"Expressed orange peel, floated on top before beer",note:"Old Monk's molasses and vanilla character under a dark beer is deeply satisfying. Carlsberg Elephant's malt works with the rum. A monsoon evening beertini."},
{name:"Hibiscus Beer Spritz",base:["beer","gin"],type:["indian","signature"],season:["summer","monsoon"],complexity:2,glass:"Wine glass or Highball",chill:false,
 ing:["beer","gin","hibiscus","lime","simple syrup"],
 ratio:[["Gin","1"],["Hibiscus cold brew","1"],["Lime","0.5"],["Simple syrup","0.25"],["Cold light beer","2"]],
 method:"Cold brew dried hibiscus flowers 4-6 hrs. Cut a lime wheel and set aside. In the glass over ice, combine gin, hibiscus brew, lime, syrup. Stir once. Top cold Kölsch gently over the back of a spoon. The deep crimson-pink bleed through the beer foam is the presentation.",garnish:"Lime wheel inside the glass before ice, hibiscus flower on top if available",note:"The hibiscus cold brew creates a stunning colour gradient through the beer. Dried gudhal flowers from any kirana. Summer signature beertini."},
{name:"Ginger Beer Beertini",base:["beer","whisky"],type:["classic"],season:["monsoon","winter"],complexity:2,glass:"Lowball",chill:false,
 ing:["whisky","beer","ginger","honey","lime"],
 ratio:[["Teacher's 50","1"],["Fresh ginger juice","0.25"],["Honey syrup","0.5"],["Lime","0.5"],["Cold craft beer","2"]],
 method:"Add whisky, ginger juice, honey, lime to shaker with ice. Shake hard. Strain into lowball over fresh ice. Top cold craft beer gently down the side. Single slow stir.",garnish:"Candied ginger, lime wedge",note:"A winter beertini. Teacher's 50 and craft beer share a malt profile — the ginger and honey are the bridge. Basmati Blonde or Kölsch both work."},
{name:"Velvet Monk",base:["beer","rum"],type:["indian","signature"],season:["winter"],complexity:1,glass:"Highball",chill:false,
 ing:["rum","beer","cola","lime"],
 ratio:[["Old Monk","1"],["Cola","1"],["Cold dark beer","1"],["Lime","squeeze"]],
 method:"Fill highball with ice. Pour Old Monk. Add cola halfway. Top dark beer gently. Lime squeeze dropped in. Do not stir.",garnish:"Lime wedge on rim",note:"A half-and-half beertini — rum cola meets dark beer. Carlsberg Elephant makes this rich and heavy. A cold winter evening drink."},

/* ── STYLISED CLASSICS ──────────────────────────────── */
{name:"Zesty G&T",base:["gin"],type:["classic"],season:["summer","monsoon"],complexity:1,glass:"Highball",chill:false,
 ing:["gin","tonic","lime","triple sec"],
 ratio:[["Gin","2"],["Triple sec","0.25"],["Tonic","4"],["Lime","wedge"]],
 method:"Cut a lime wheel and press it against the inside of the glass — garnish first. Fill with ice to the brim. Pour gin. Add a small pour of triple sec over the ice — just enough to add orange warmth, not enough to dominate. Add tonic gently down the side. One slow stir. The triple sec bleeds gently through the tonic.",garnish:"Lime wheel inside glass, expressed orange peel floated on top",note:"The orange fragrance from the triple sec lifts the botanicals of Greater Than beautifully. A quarter measure only — this is a subtle upgrade, not a different drink. The expressed orange peel on top doubles down on the citrus aroma."},
{name:"Smoked Honey Highball",base:["whisky"],type:["signature"],season:["winter","monsoon"],complexity:2,glass:"Highball",chill:false,
 ing:["whisky","honey","soda","lime"],
 ratio:[["Teacher's 50","2"],["Honey syrup","0.5"],["Chilled soda","3"],["Lime","squeeze"]],
