let selectedIngs = new Set();

function buildIngGrid() {
  const g = document.getElementById('ingGrid');
  g.innerHTML = '';
  // Group ingredients by category for better UX
  const GROUPS = [
    {label:'🫙 Spirits', items:["gin","vodka","whisky","rum","brandy","tequila","peach schnapps"]},
    {label:'🍺 Beer & Wine', items:["beer","wine","sparkling wine","aperol"]},
    {label:'🫧 Mixers', items:["tonic","soda","ginger beer","cola","lime soda","craft cola"]},
    {label:'🍋 Fresh', items:["lime","orange juice","cranberry","milk","coconut water"]},
    {label:'🍯 Syrups & Mods', items:["simple syrup","honey","triple sec","vermouth","grenadine","bitters"]},
    {label:'🌶️ Indian Pantry', items:["rooh afza","kokum syrup","aam panna","jaljeera","darjeeling tea","tamarind","jamun","hibiscus"]},
    {label:'🌱 Aromatics', items:["ginger","mint","chai","cardamom","saffron","cumin"]},
    {label:'🧂 Spice & Salt', items:["kala namak","chaat masala","tabasco","yogurt"]},
  ];
  GROUPS.forEach(group => {
    const groupDiv = document.createElement('div');
    groupDiv.style.cssText = 'width:100%;margin-bottom:.75rem;';
    groupDiv.innerHTML = `<div style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt-xs);margin-bottom:5px;padding-bottom:4px;border-bottom:1px solid var(--border)">${group.label}</div><div class="ing-group-pills" style="display:flex;flex-wrap:wrap;gap:5px;"></div>`;
    const pillWrap = groupDiv.querySelector('.ing-group-pills');
    group.items.forEach(ing => {
      const id = 'ing-' + ing.replace(/[\s]/g,'-');
      const emoji = ING_EMOJI[ing] || '•';
      pillWrap.innerHTML += `<input type="checkbox" class="ing-chk" id="${id}" value="${ing}" onchange="renderBar()"><label class="ing-lbl" for="${id}">${emoji} ${ing}</label>`;
    });
    g.appendChild(groupDiv);
  });
}

function resetIngredients() {
  document.querySelectorAll('.ing-chk').forEach(c => c.checked = false);
  selectedIngs.clear();
  renderBar();
}

function renderBar() {
  selectedIngs = new Set([...document.querySelectorAll('.ing-chk:checked')].map(c => c.value));
  const grid = document.getElementById('barGrid');
  const info = document.getElementById('ingMatchInfo');
  const countLbl = document.getElementById('barCountLbl');
  grid.innerHTML = '';

  if (selectedIngs.size === 0) {
    countLbl.textContent = '';
    info.textContent = '';
    grid.innerHTML = '<div class="no-res" style="padding:2rem 0">☝️ Tick the ingredients you have above — we\'ll show every drink you can make right now.</div>';
    return;
  }

  // Fuzzy match: a drink ingredient is matched if ANY selected ingredient is contained in it or vice versa
  function ingMatched(drinkIng) {
    const d = drinkIng.toLowerCase();
    for (const sel of selectedIngs) {
      const s = sel.toLowerCase();
      if (d.includes(s) || s.includes(d)) return true;
    }
    return false;
  }

  // Score: fully makeable = 2, mostly makeable (1 missing) = 1, else 0
  const scored = D.map(d => {
    const missing = d.ing.filter(i => !ingMatched(i));
    if (missing.length === 0) return {d, score:2, missing:[]};
    if (missing.length === 1) return {d, score:1, missing};
    return {d, score:0, missing};
  }).filter(x => x.score > 0).sort((a,b) => b.score - a.score || a.d.complexity - b.d.complexity);

  const makeable = scored.filter(x => x.score === 2);
  const almostMakeable = scored.filter(x => x.score === 1);

  info.textContent = '';
  countLbl.innerHTML = `<span style="color:var(--green-l)">✓ ${makeable.length} drink${makeable.length!==1?'s':''} you can make now</span>${almostMakeable.length ? ` &nbsp;·&nbsp; <span style="color:var(--amber)">~ ${almostMakeable.length} with 1 more ingredient</span>` : ''}`;

  if (!makeable.length && !almostMakeable.length) {
    grid.innerHTML = '<div class="no-res">🍸 Nothing matches yet — add more ingredients above.</div>';
    return;
  }

  if (makeable.length) {
    const secLabel = document.createElement('div');
    secLabel.className = 'rlabel';
    secLabel.innerHTML = '✅ Make right now';
    grid.appendChild(secLabel);
    const makeGrid = document.createElement('div');
    makeGrid.className = 'grid';
    makeable.forEach((x, i) => makeGrid.appendChild(buildCard(x.d, 'bar-' + i, 1)));
    grid.appendChild(makeGrid);
  }

  if (almostMakeable.length) {
    const secLabel2 = document.createElement('div');
    secLabel2.className = 'rlabel';
    secLabel2.style.marginTop = '1.5rem';
    secLabel2.innerHTML = '🛒 One ingredient away';
    grid.appendChild(secLabel2);
    const almostGrid = document.createElement('div');
    almostGrid.className = 'grid';
    almostMakeable.forEach((x, i) => {
      const card = buildCard(x.d, 'almost-' + i, 1);
      // Add missing ingredient badge
      const badge = document.createElement('div');
      badge.style.cssText = 'font-size:10px;color:var(--amber);margin-top:4px;padding:3px 8px;background:var(--amber-dim);border-radius:var(--r-full);display:inline-block;border:1px solid rgba(200,152,64,.2)';
      badge.textContent = '+ need: ' + x.missing.join(', ');
      card.querySelector('.card-left').appendChild(badge);
      almostGrid.appendChild(card);
    });
    grid.appendChild(almostGrid);
  }
}

let fBase='all', fType='all', fSeason='all';

function setF(cat, val, btn) {
  if (cat==='base') fBase=val; else if (cat==='type') fType=val; else fSeason=val;
  const row = cat==='base'?'baseF': cat==='type'?'typeF':'seasonF';
  document.querySelectorAll('#'+row+' .fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function onSearch() {
  const val = document.getElementById('srch').value;
  document.getElementById('srchClear').classList.toggle('show', val.length > 0);
  render();
}

function clearSearch() {
  document.getElementById('srch').value = '';
  document.getElementById('srchClear').classList.remove('show');
  render();
}

function matches(d) {
  const s = document.getElementById('srch').value.toLowerCase();
  const bm = fBase==='all' || d.base.includes(fBase);
  const tm = fType==='all' || d.type.includes(fType);
  const sm = fSeason==='all' || d.season.includes(fSeason);
  const srm = !s || d.name.toLowerCase().includes(s)
    || d.base.some(b => b.includes(s))
    || d.type.some(t => t.includes(s))
    || d.ratio.some(r => r[0].toLowerCase().includes(s))
    || (d.note && d.note.toLowerCase().includes(s));
  return bm && tm && sm && srm;
}

const SE = {gin:'🌿',vodka:'🧊',whisky:'🥃',rum:'🍬',tequila:'🌵',brandy:'🍂',wine:'🍷',beer:'🍺',virgin:'🌊','peach schnapps':'🍑'};
function getEmoji(bases) {
  for (const s of ['gin','vodka','whisky','rum','tequila','brandy','wine','beer','peach schnapps','virgin'])
    if (bases.includes(s)) return SE[s] || '🍹';
  return '🍹';
}

function tagHtml(d) {
  let h = '';
  if (d.type.includes('signature')) h += '<span class="tag t-sig">⭐ Sig</span>';
  if (d.type.includes('indian'))    h += '<span class="tag t-ind">🌶️ Indian</span>';
  if (d.type.includes('future'))    h += '<span class="tag t-fut">🔮 Future</span>';
  if (d.type.includes('beertini'))  h += '<span class="tag t-beer">🍺 Beertini</span>';
  if (d.season.includes('summer'))  h += '<span class="tag t-sum">☀️</span>';
  if (d.season.includes('monsoon')) h += '<span class="tag t-mon">🌧️</span>';
  if (d.season.includes('winter'))  h += '<span class="tag t-win">❄️</span>';
  h += '<span class="dots" title="Complexity">';
  for (let i=1;i<=3;i++) h += `<span class="dot${i<=d.complexity?' on':''}"></span>`;
  h += '</span>';
  return h;
}

═══════════════════════════════════════════════════════ */
function buildCard(d, idPrefix, batchMult) {
  const card = document.createElement('div');
  card.className = 'card';
  card.setAttribute('data-base', d.base.join(' '));

  const bases = d.base.filter(b => !['virgin'].includes(b)).map(b => b.charAt(0).toUpperCase()+b.slice(1)).join(' · ');
  const emoji = getEmoji(d.base);
  const chillHtml = d.chill ? '<span class="chill-flag">❄ CHILL GLASS</span>' : '';

  // Batch-multiplied ratio
  const mult = batchMult || 1;
  const ratioHtml = d.ratio.map(r => {
    const num = parseFloat(r[1]);
    const val = !isNaN(num) ? (num * mult % 1 === 0 ? num * mult : (num * mult).toFixed(1)) : r[1];
    return `<span class="ri">${r[0]} <strong>${val}</strong></span>`;
  }).join('');

  card.innerHTML = `
    <div class="card-head">
      <div class="card-left">
        <div class="card-emoji">${emoji}</div>
        <div class="card-name">${d.name}${chillHtml}</div>
        <div class="card-meta">${bases||'Virgin'} &nbsp;·&nbsp; ${d.glass}</div>
        <div class="tags">${tagHtml(d)}</div>
      </div>
      <span class="chevron">▾</span>
    </div>
    <div class="detail">
      <div class="d-inner">
        <div class="batch-row">
          <span class="batch-lbl">Batch for:</span>
          <button class="batch-btn active" onclick="setBatch(this,1,'${idPrefix}')">1</button>
          <button class="batch-btn" onclick="setBatch(this,4,'${idPrefix}')">4 people</button>
          <button class="batch-btn" onclick="setBatch(this,8,'${idPrefix}')">8 people</button>
          <button class="batch-btn" onclick="setBatch(this,12,'${idPrefix}')">12 people</button>
        </div>
        <div class="dlabel">⚗️ Ratio</div>
        <div class="ratio-wrap" id="ratio-${idPrefix}">${ratioHtml}</div>
        <div class="dlabel">📋 Method</div>
        <div class="dtext">${wrapTech(d.method)}</div>
        <div class="dlabel">🌿 Garnish</div>
        <div class="dtext">${d.garnish||'None'}</div>
        ${d.note ? `<div class="dnote">💬 ${d.note}</div>` : ''}
      </div>
    </div>`;

  card.addEventListener('click', e => {
    if (e.target.closest('.batch-btn') || e.target.closest('.tech')) return;
    const op = card.classList.contains('open');
    document.querySelectorAll('.card.open').forEach(c => c.classList.remove('open'));
    if (!op) card.classList.add('open');
  });

  // Store data for batch recalc
  card._data = d;
  card._idPrefix = idPrefix;
  return card;
}

function setBatch(btn, mult, idPrefix) {
  // find parent card
  const card = btn.closest('.card');
  card.querySelectorAll('.batch-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const d = card._data;
  const wrap = card.querySelector('.ratio-wrap');
  wrap.innerHTML = d.ratio.map(r => {
    const num = parseFloat(r[1]);
    const val = !isNaN(num) ? (num * mult % 1 === 0 ? num * mult : (num * mult).toFixed(1)) : r[1];
    return `<span class="ri">${r[0]} <strong>${val}</strong></span>`;
  }).join('');
}

// Mood scoring: returns a "why" note and a score
function scoreDrink(d, answers) {
  let score = 0;
  const {mood, season, strength} = answers;

  // Season match (highest weight)
  if (d.season.includes(season)) score += 3;

  // Mood match
  const moodMap = {
    refreshing: ['gin','vodka','beer','virgin'],
    warming:    ['whisky','rum','brandy'],
    social:     ['wine','beer','vodka','rum'],
    elegant:    ['gin','whisky','brandy','tequila'],
  };
  if (mood && moodMap[mood] && d.base.some(b => moodMap[mood].includes(b))) score += 2;

  // Strength
  const strengthMap = { light:1, medium:2, strong:3 };
  const target = strengthMap[strength] || 2;
  if (d.complexity === target) score += 2;
  else if (Math.abs(d.complexity - target) === 1) score += 1;

  // Bonus: signature & indian
  if (d.type.includes('signature')) score += 1;

  return score;
}

function getMoodWhy(d, answers) {
  const lines = [];
  if (d.season.includes(answers.season)) lines.push(`Perfect for ${answers.season}`);
  if (d.type.includes('signature')) lines.push('House signature');
  if (d.type.includes('indian')) lines.push('Indian touch');
  if (answers.mood === 'refreshing' && d.complexity === 1) lines.push('Easy & refreshing');
  if (answers.mood === 'warming' && ['whisky','rum','brandy'].some(s => d.base.includes(s))) lines.push('Warming spirit base');
  if (answers.mood === 'elegant' && d.complexity >= 2) lines.push('Proper technique involved');
  if (answers.strength === 'strong' && d.complexity === 3) lines.push('Spirit-forward, no fuss');
  return lines.slice(0,2).join(' · ') || 'Good all-rounder for tonight';
}

function qdScore(d, ans) {
  let score = 0;
  const {who, time, mood, season} = ans;

  if (d.season.includes(season)) score += 4;

  // who
  if (who === 'her') {
    if (['Vesper Martini','Gimlet','Cosmopolitan','French 75','Bee\'s Knees','Gulabi Fizz','Spritzer','Kir','Bramble','Pornstar Martini'].includes(d.name)) score += 4;
    if (d.complexity >= 2) score += 1;
  }
  if (who === 'me') {
    if (d.base.includes('whisky')) score += 3;
    if (['Old Fashioned','Whisky Highball','Penicillin','Adrak Highball','Chai Old Fashioned','Whisky Sour'].includes(d.name)) score += 2;
  }
  if (who === 'guests') {
    if (d.complexity === 1) score += 2;
    if (['Mojito','G&T','Old Monk & Cola','Tom Collins','Vodka Soda','Beer Straight'].includes(d.name)) score += 2;
  }
  if (who === 'both') {
    if (d.complexity === 2) score += 2;
  }

  // time
  if (time === '2min' && d.complexity === 1) score += 3;
  if (time === '5min' && d.complexity <= 2) score += 2;
  if (time === '10min' && d.complexity === 3) score += 3;

  // mood
  if (mood === 'light' && d.season.includes('summer')) score += 2;
  if (mood === 'light' && d.base.some(b => ['gin','vodka','beer','wine','virgin'].includes(b))) score += 2;
  if (mood === 'deep' && d.base.some(b => ['whisky','rum','brandy'].includes(b))) score += 3;
  if (mood === 'deep' && d.complexity === 3) score += 1;
  if (mood === 'festive' && d.type.includes('signature')) score += 3;
  if (mood === 'festive' && d.complexity >= 2) score += 1;
  if (mood === 'easy' && d.complexity === 1) score += 3;

  if (d.type.includes('signature')) score += 1;
  return score;
}

function qdWhy(d, ans) {
  const lines = [];
  if (d.season.includes(ans.season)) lines.push(`Made for ${ans.season}`);
  if (d.type.includes('signature')) lines.push('House signature');
  if (d.type.includes('indian')) lines.push('Indian touch');
  if (ans.time === '2min' && d.complexity === 1) lines.push('Ready in 2 minutes');
  if (ans.time === '10min' && d.complexity === 3) lines.push('Worth the effort');
  if (ans.mood === 'deep' && d.base.includes('whisky')) lines.push('Whisky, spirit-forward');
  if (ans.mood === 'festive' && d.type.includes('signature')) lines.push('Showstopper');
  return lines.slice(0,2).join(' · ') || 'Solid choice for tonight';
}

      <div class="qd-hero" onclick="jumpToRecipe('${top.d.name}')" data-base="${top.d.base.join(' ')}">
        <div class="qd-hero-emoji">${topEmoji}</div>
        <div class="qd-hero-name">${top.d.name}</div>
        <div class="qd-hero-meta">${topBases||'Virgin'} &nbsp;·&nbsp; ${top.d.glass}</div>
        <div class="qd-hero-why">${topWhy}</div>
        <div class="qd-hero-tap">Tap to see the recipe →</div>
      </div>
      ${rest.length ? `<div style="font-size:11px;color:var(--txt-s);letter-spacing:1px;text-transform:uppercase;margin:1.25rem 0 .6rem">Also good tonight</div>
      <div class="mood-cards">${altHtml}</div>` : ''}
      <button class="mood-restart" onclick="initQD()">← Start over</button>
    </div>`;
}

/* ═══════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════ */
buildIngGrid();
render();
initQD();
</script>
</body>
</html>
